name: silentgreen check
description: Verify a batch of recorded AI work, and comment the result on the pull request.
author: harsh01369

branding:
  icon: check-circle
  color: green

inputs:
  file:
    description: Path or glob of the JSONL/JSON/CSV export to check.
    required: true
  fail-on-problem:
    description: Fail the job when any answer is flagged. Set to "false" to comment only.
    required: false
    default: 'true'
  comment:
    description: Post the summary as a pull-request comment.
    required: false
    default: 'true'
  no-grounding:
    description: Skip the groundedness check (for batches with no source material).
    required: false
    default: 'false'
  contract:
    description: Path to a contract file to check the batch against.
    required: false
  prompt:
    description: Path to the current prompt. If the contract is bound to it and it has changed, proven results become unproven.
    required: false

outputs:
  problems:
    description: Number of answers flagged with a problem.
    value: ${{ steps.run.outputs.problems }}
  inconclusive:
    description: Number of answers that could not be proven either way.
    value: ${{ steps.run.outputs.inconclusive }}
  clean:
    description: Number of answers that carried no detectable problem.
    value: ${{ steps.run.outputs.clean }}
  report:
    description: Path to the full JSON report.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        SG_FILE: ${{ inputs.file }}
        SG_FAIL: ${{ inputs.fail-on-problem }}
        SG_COMMENT: ${{ inputs.comment }}
        SG_NOGROUND: ${{ inputs.no-grounding }}
        SG_CONTRACT: ${{ inputs.contract }}
        SG_PROMPT: ${{ inputs.prompt }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        args=("$SG_FILE" --json)
        [ "$SG_NOGROUND" = "true" ] && args+=(--no-grounding)
        [ -n "$SG_CONTRACT" ] && args+=(--contract "$SG_CONTRACT")
        [ -n "$SG_PROMPT" ] && args+=(--prompt "$SG_PROMPT")

        report="$RUNNER_TEMP/silentgreen-report.json"
        set +e
        npx --yes github:harsh01369/silentgreen check "${args[@]}" > "$report"
        set -e

        if ! jq -e . "$report" > /dev/null 2>&1; then
          echo "::error::silentgreen produced no readable report"
          cat "$report" || true
          exit 1
        fi

        problems=$(jq -r '.counts.problems' "$report")
        inconclusive=$(jq -r '.counts.inconclusive' "$report")
        clean=$(jq -r '.counts.clean' "$report")
        total=$(jq -r '.counts.total' "$report")

        {
          echo "problems=$problems"
          echo "inconclusive=$inconclusive"
          echo "clean=$clean"
          echo "report=$report"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### silentgreen check"
          echo
          jq -r '.headline' "$report"
          echo
          echo "| verdict | count |"
          echo "| --- | --- |"
          echo "| proven | $clean |"
          echo "| violated | $problems |"
          echo "| unproven | $inconclusive |"
          echo
          if [ "$problems" -gt 0 ]; then
            echo "**Flagged**"
            echo
            jq -r '.tasks[] | select(.verdict == "violated") | "- `" + .id + "` — " + (.problems[0].summary // "flagged")' "$report" | head -20
            echo
          fi
          jq -r '.signals[]? | "- _across the batch:_ " + .summary' "$report"
          echo
          if jq -e '.contract' "$report" > /dev/null 2>&1; then
            echo "**Contract: $(jq -r '.contract.pipeline' "$report")**"
            echo
            if [ "$(jq -r '.contract.stale' "$report")" = "true" ]; then
              echo "> :warning: $(jq -r '.contract.staleReason' "$report")"
              echo
            fi
            echo "proven $(jq -r '.contract.summary.proven' "$report") · violated $(jq -r '.contract.summary.violated' "$report") · unproven $(jq -r '.contract.summary.unproven' "$report")"
            echo
            jq -r '.contract.tasks[]? | select(.verdict == "violated") | "- `" + .id + "` — " + (.clauses[] | select(.verdict == "violated") | .clause + ": " + .detail)' "$report" | head -20
            echo
          fi
          jq -r '"> " + .caveat' "$report"
        } > "$RUNNER_TEMP/sg-comment.md"

        cat "$RUNNER_TEMP/sg-comment.md"
        {
          echo "## silentgreen"
          cat "$RUNNER_TEMP/sg-comment.md"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$SG_COMMENT" = "true" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$RUNNER_TEMP/sg-comment.md" || echo "could not post comment"
        fi

        contract_violated=$(jq -r '.contract.summary.violated // 0' "$report")
        if [ "$SG_FAIL" = "true" ] && { [ "$problems" -gt 0 ] || [ "$contract_violated" -gt 0 ]; }; then
          echo "::error::silentgreen flagged $problems of $total answers, plus $contract_violated contract violation(s)"
          exit 1
        fi
