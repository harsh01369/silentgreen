name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: typecheck
        run: npm run check

      - name: tests
        run: npm test

      - name: score the checks against the labelled corpus
        run: npm run dev -- eval

      - name: the CLI surfaces are wired
        run: |
          # `check` exits non-zero when it finds problems, which the demo always has.
          npm run --silent dev -- check --json > report.json || true
          node -e 'const j=require("./report.json"); if(j.counts.total!==20||j.counts.problems!==7||j.tasks.length!==20) throw new Error("check --json shape changed: "+JSON.stringify(j.counts))'
          npx tsx -e "import {demoTasks} from './src/aiwork/demo'; import {writeFileSync} from 'node:fs'; writeFileSync('ci-demo.jsonl', demoTasks().map(t=>JSON.stringify(t)).join('\n'))"
          npm run --silent dev -- contract ci-demo.jsonl --name ci | tee ci.sg.yaml | grep -q 'basis: intent'
          sed -i 's/TODO:.*/Harsh, CI fixture, these rules describe the demo pipeline"/' ci.sg.yaml
          npm run --silent dev -- check ci-demo.jsonl --contract ci.sg.yaml --json > cr.json || true
          node -e 'const j=require("./cr.json"); if(!j.contract||j.contract.pipeline!=="ci") throw new Error("contract not in report")'
          npm run --silent dev -- inspect ci-demo.jsonl --task task-004 --json > in.json
          node -e 'const j=require("./in.json")[0]; if(j.segments.map(s=>s.text).join("")!==j.answer) throw new Error("inspect segments do not reassemble"); if(j.counts.ungrounded!==4) throw new Error("inspect ungrounded count changed: "+j.counts.ungrounded)'
          rm -f ci-demo.jsonl ci.sg.yaml report.json cr.json in.json

      - name: build
        run: npm run build

      - name: the committed dist/ is up to date
        run: |
          git diff --exit-code -- dist \
            || (echo "dist/ is stale. run 'npm run build' and commit the result." && exit 1)

      - name: the web demo data matches the engine
        run: |
          npx tsx scripts/gen-web-demo.ts
          git diff --exit-code -- apps/web/src/data \
            || (echo "apps/web/src/data/demo.json is stale. regenerate and commit." && exit 1)

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: typecheck
        run: npm run check
      - name: the generated migration matches the schema
        run: |
          DATABASE_URL="postgresql://x:x@localhost:5432/x" npx drizzle-kit generate
          git diff --exit-code -- drizzle \
            || (echo "drizzle/ is stale. run 'npm run db:generate' and commit." && exit 1)
